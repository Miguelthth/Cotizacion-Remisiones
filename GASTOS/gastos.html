<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMETEC – Gastos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#023561">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<!-- tema-inicial.js ANTES del CSS (elige día/noche sin parpadeo) -- mismo
     tema del ERP, generado por 16.- IDENTIDAD-NEGOCIO/generar_tema.py. No
     editar sumetec-tema.css ni tema-inicial.js a mano. Sin botón manual de
     día/noche aquí a propósito (F5b, 2026-09-11): sigue el sistema solo,
     sin agregar un control nuevo a la barra de Gastos. -->
<script src="tema-inicial.js"></script>
<link rel="stylesheet" href="sumetec-tema.css">
<style>
/* Todos los tokens (--sm-glass-*, --sm-bg, --sm-navy, etc.) y la letra IBM
   Plex vienen de sumetec-tema.css (F5b, 2026-09-11) -- ANTES este bloque
   traía sus propios valores fijos, aproximados al ERP a mano; ahora son los
   reales, y voltean solos entre día y noche. Las reglas de aquí abajo son
   la convención PROPIA de Gastos (.btn / .btn.secondary / .btn.danger,
   distinta a la de Dirección/Compras) -- se conservan tal cual, solo
   cambiaron los colores fijos por los tokens del tema. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;background:var(--sm-bg);color:var(--sm-ink);padding-bottom:80px}

header{
  position:relative;isolation:isolate;overflow:hidden;
  background:var(--sm-glass-nav-fondo);color:#fff;padding:14px 16px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--sm-glass-nav-borde);
  -webkit-backdrop-filter:blur(var(--sm-glass-nav-blur)) saturate(150%);
  backdrop-filter:blur(var(--sm-glass-nav-blur)) saturate(150%);
  box-shadow:0 10px 26px rgb(2 25 45 / .28), inset 0 1px 0 var(--sm-glass-nav-reflejo);
}
header h1{font-size:16px;font-weight:700;position:relative;z-index:2}
header>*{position:relative;z-index:2}

.card,.toast,.btn{position:relative;isolation:isolate;overflow:hidden}

.card{
  background:var(--sm-glass-tarjeta-fondo);border-radius:10px;padding:14px;margin:12px;
  border:1px solid var(--sm-glass-superficie-borde);
  -webkit-backdrop-filter:blur(var(--sm-glass-superficie-blur)) saturate(130%);
  backdrop-filter:blur(var(--sm-glass-superficie-blur)) saturate(130%);
  box-shadow:0 6px 18px var(--sm-glass-superficie-sombra), inset 0 1px 0 rgb(255 255 255 / .5);
  transition:transform .2s ease, box-shadow .2s ease;
}

.btn{
  background:color-mix(in srgb, var(--sm-green) 82%, transparent);color:#fff;border:none;border-radius:8px;
  padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
  border:1px solid rgb(255 255 255 / .38);
  -webkit-backdrop-filter:blur(10px) saturate(140%);
  backdrop-filter:blur(10px) saturate(140%);
  box-shadow:0 4px 12px rgb(2 53 97 / .2), inset 0 1px 0 rgb(255 255 255 / .4);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn.secondary{background:color-mix(in srgb, var(--sm-accent) 82%, transparent)}
.btn.danger{background:color-mix(in srgb, var(--sm-chart-4) 82%, transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active{transform:translateY(1px);box-shadow:0 2px 6px rgb(2 53 97 / .22), inset 0 1px 0 rgb(255 255 255 / .3)}

/* Anillo de luz reactivo al cursor/toque -- capa decorativa, sin clic, debajo
   del contenido. Igual mecanismo que liquid-glass-theme.js del ERP: solo se
   activa en el elemento bajo el puntero y no se mueve nada mas. */
header::after,.card::after,.btn::after{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;
  transition:opacity .16s ease;
  background:radial-gradient(220px circle at var(--sm-liquid-x,50%) var(--sm-liquid-y,50%), var(--sm-glass-superficie-luz), transparent 68%);
}
header::after{background:radial-gradient(260px circle at var(--sm-liquid-x,50%) var(--sm-liquid-y,50%), var(--sm-glass-nav-luz), transparent 70%)}
header.sm-liquid-activa::after,.card.sm-liquid-activa::after,.btn.sm-liquid-activa::after{opacity:1}
.card.sm-liquid-activa{transform:translateY(-2px);box-shadow:0 12px 24px var(--sm-glass-superficie-sombra), inset 0 1px 0 rgb(255 255 255 / .55)}

select,input{width:100%;padding:8px;border:1px solid var(--sm-border-soft);border-radius:6px;font-size:14px;font-family:inherit;margin-top:4px;background:var(--sm-surface);color:var(--sm-ink)}
/* En el teléfono, Safari acerca la pantalla si el campo mide menos de 16px. */
@media (pointer: coarse){select,input{font-size:16px}}
.fila-producto{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--sm-line)}
.fila-producto .info{flex:1}
.fila-producto .codigo{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--sm-muted)}
.fila-producto input[type=number]{width:80px;text-align:right}
#tokenGate{display:none;position:fixed;inset:0;z-index:999;background:color-mix(in srgb, var(--sm-navy) 92%, transparent);align-items:center;justify-content:center}
#tokenGate .card{width:280px}
.toast{
  position:fixed;bottom:16px;left:16px;right:16px;z-index:1000;display:none;
  background:color-mix(in srgb, var(--sm-ink) 82%, transparent);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;
  border:1px solid rgb(255 255 255 / .12);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  backdrop-filter:blur(16px) saturate(140%);
}
.toast.show{display:block}
#badgePendientes{cursor:pointer}
.ia-tocado{background:color-mix(in srgb, var(--sm-aviso) 16%, var(--sm-surface));border-color:var(--sm-aviso)}

@media (prefers-reduced-motion: reduce){
  .card,.btn,header::after,.card::after,.btn::after{transition:none!important}
  .card.sm-liquid-activa{transform:none}
  .btn:active{transform:none}
}
@media (prefers-reduced-transparency: reduce){
  header,.card,.toast,.btn{background:var(--sm-navy);-webkit-backdrop-filter:none;backdrop-filter:none}
  .card{background:var(--sm-surface)}
  .btn{background:var(--sm-green)}
  .btn.secondary{background:var(--sm-accent)}
  .btn.danger{background:var(--sm-chart-4)}
  .toast{background:var(--sm-ink)}
  header::after,.card::after,.btn::after{display:none}
}
@supports not (backdrop-filter: blur(1px)){
  header{background:var(--sm-navy)}
  .card{background:var(--sm-surface)}
  .btn{background:var(--sm-green)}
  .btn.secondary{background:var(--sm-accent)}
  .btn.danger{background:var(--sm-chart-4)}
  .toast{background:var(--sm-ink)}
}
</style>
</head>
<body>

<header>
  <h1 id="tituloApp">💰 Gastos — SUMETEC</h1>
  <span id="badgePendientes" onclick="verColaPendiente()" style="font-size:11px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px"></span>
  <span id="badgeVersion" onclick="_mostrarVersionInstalada()" style="font-size:11px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:10px;cursor:pointer" title="Ver actualización de software">ℹ️</span>
</header>

<div id="app"></div>

<div id="tokenGate">
  <div class="card">
    <h2 style="margin-bottom:10px;font-size:16px">🔑 Token de acceso</h2>
    <p style="font-size:12px;color:var(--sm-muted);margin-bottom:10px">Es el mismo token que usas en Remisiones.</p>
    <input id="tg_nombre" type="text" placeholder="Tu nombre">
    <input id="tg_input" type="password" placeholder="Pega tu token aquí…" style="margin-top:8px">
    <button class="btn" style="width:100%;margin-top:10px" onclick="_tgGuardar()">Continuar</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ── Token: compartido por origen con remision.html (localStorage) ──────────
let API_TOKEN = (localStorage.getItem('api_token') || '').trim();

// Ecosistema centralizado (2026-09): valores de fábrica IDÉNTICOS a los que
// ya estaban horneados aquí -- si el ERP nunca publica nada, el
// comportamiento no cambia. Ver _cargarConfiguracionEcosistema_ más abajo.
let FOTO_TOPE_KB_PUBLICADO = 250;
// Mejora (2026-09-02, confirmado por Miguel): a partir de este total, pedir
// confirmación explícita antes de guardar el gasto -- suele ser un cero de
// más al teclear, no un límite que bloquee gastos grandes reales.
const UMBRAL_GASTO_ATIPICO = 2000;

// Escapa texto y valores de atributo HTML (mismo comportamiento que
// esc()/escAttr() en calculos.js -- inline aquí porque inventario.html no
// carga ese archivo). Necesario: descripciones de tornillería traen `"`
// literal (medidas en pulgadas, ej. TORNILLO 1/4" x 2") que rompería el
// atributo value="..." o el HTML si se interpola sin escapar.
function esc(v) {
  return v == null ? '' : String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function toast(msg, ms) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, ms || 3000);
}

function _tokenGateCheck() {
  const mostrar = !API_TOKEN;
  document.getElementById('tokenGate').style.display = mostrar ? 'flex' : 'none';
  // Si el nombre ya se capturó desde remision.html (mismo origen), precargarlo.
  if (mostrar) {
    const nEl = document.getElementById('tg_nombre');
    const yaTiene = _leerVendedorCompartido();
    if (nEl && yaTiene && !nEl.value) nEl.value = yaTiene;
  }
}
// I-5: "vendedor" se guarda en la MISMA clave 'r_empresa' que usa remision.html
// (mismo origen de GitHub Pages -> mismo localStorage) -- así el nombre
// capturado en cualquiera de las dos apps sirve para las dos, sin duplicar
// captura ni inventar una clave nueva.
function _leerVendedorCompartido() {
  try { return (JSON.parse(localStorage.getItem('r_empresa') || '{}').vendedor || '').trim(); }
  catch (_) { return ''; }
}
function _guardarVendedorCompartido(nombre) {
  let obj = {};
  try { obj = JSON.parse(localStorage.getItem('r_empresa') || '{}') || {}; } catch (_) { obj = {}; }
  obj.vendedor = nombre;
  localStorage.setItem('r_empresa', JSON.stringify(obj));
}
function _tgGuardar() {
  const v = (document.getElementById('tg_input').value || '').trim();
  const nombre = (document.getElementById('tg_nombre').value || '').trim();
  if (!nombre) { toast('Escribe tu nombre primero'); return; }
  if (!v) { toast('Escribe el token primero'); return; }
  _guardarVendedorCompartido(nombre);
  API_TOKEN = v;
  localStorage.setItem('api_token', v);
  _tokenGateCheck();
  _iniciarAppSegunModo_();
}

// Punto de entrada único. Desde 2026-09-11 (F5 del plan de diseño) Gastos
// ya no tiene modo Inventario -- el conteo se mudó a la app de Dirección
// (14.- SUMETEC DIRECCION/inventario.js). Se conserva el nombre: lo usan
// el arranque de abajo y configuracion_ecosistema.test.js.
function _iniciarAppSegunModo_() {
  renderGastos();
}

// ── URL del servidor: MISMA que remisiones (remision.html::URL_SERVIDOR).
//    Solo cambia si creas una implementación NUEVA del Apps Script. ──
const URL_SERVIDOR = 'https://script.google.com/macros/s/AKfycbxQ3o4Fapo78sEbAAsMoGjyjMrcsL7lMXRwwig0r2ZhRAwi_Ukdi3CHkGrilpcTsgrK/exec';

function getScriptUrl() { return URL_SERVIDOR; }

// ── Cola offline / persistencia local (helpers usados por catálogo, conteo
// en curso y cola de envío) ─────────────────────────────────────────────────
function leerSeguro(clave, porDefecto) {
  try { const v = localStorage.getItem(clave); return v === null ? porDefecto : JSON.parse(v); }
  catch (_) { return porDefecto; }
}
function guardarSeguro(clave, valorObj) {
  try { localStorage.setItem(clave, JSON.stringify(valorObj)); return true; }
  catch (_) { return false; }
}
function _dedupeCola_(cola, id) { return cola.some(e => e.id === id); }

// Se conserva SOLO para armar el teorico_ref de un conteo que quedó a medias
// al llegar la versión sin Inventario (ver _enviarConteoHuerfano_): lee el
// último stock teórico que este teléfono guardó. Función pura.
function _construirStockTeoricoMap(filas) {
  const m = new Map();
  if (!Array.isArray(filas)) return m;
  filas.forEach(f => {
    const cod = String(f.CODIGO || '').trim();
    if (!cod) return;
    const stock = Number(f.STOCK_TEORICO);
    if (isNaN(stock)) return;
    // Mejora 3 (2026-07-29): de qué se compone el teórico -- ENTRADAS
    // (compras)/SALIDAS (ventas)/AJUSTES (carga inicial + conteos +
    // correcciones manuales, el ERP no las distingue entre sí -- ver
    // routers/inventario.py::_calcular_stock). Columnas nuevas, aditivas: si
    // el celular tiene un caché viejo de antes de esto, caen a 0 sin tronar.
    const entradas = Number(f.ENTRADAS); const salidas = Number(f.SALIDAS); const ajuste = Number(f.AJUSTES);
    m.set(cod.toLowerCase(), {
      stock, desc: f.DESCRIPCION || '',
      entradas: isNaN(entradas) ? 0 : entradas,
      salidas: isNaN(salidas) ? 0 : salidas,
      ajuste: isNaN(ajuste) ? 0 : ajuste,
    });
  });
  return m;
}

function _haceCuanto_(ts) {
  const min = Math.round((Date.now() - ts) / 60000);
  if (min < 1) return 'un momento';
  if (min < 60) return min + ' min';
  const h = Math.round(min / 60);
  if (h < 24) return h + ' h';
  return Math.round(h / 24) + ' días';
}

// ═══════════════════════════════════════════════════════════════════════════
// ── BLOQUE GASTOS (J-1/J-2/J-3, 2026-07-22) ─────────────────────────────────
// Espejo del cálculo de servicios/gastos.py::calcular_montos_gasto -- el
// servidor de Apps Script y el ERP NUNCA recalculan, solo guardan lo que
// sale de aquí (misma regla "espejo" que ya rige remisiones/pagos).
// ═══════════════════════════════════════════════════════════════════════════

function _calcularMontosGasto_(modo, montoSinIva, ivaPct, totalConIva, ivaPesos) {
  // '' -> null (no 0): un <select>/<input> vacío no debe colarse como "0%"
  // válido -- Number('') es 0, no NaN, así que hay que cortarlo aparte.
  const num = v => { if (v === '' || v == null) return null; const n = Number(v); return isNaN(n) ? null : n; };
  modo = (modo || 'A').toUpperCase();

  if (modo === 'B') {
    const total = num(totalConIva), pct = num(ivaPct);
    const errores = [];
    if (total === null || total < 0) errores.push('El TOTAL debe ser un número (ej. 500.00) y no negativo.');
    if (pct === null || [0, 0.08, 0.16].indexOf(pct) === -1) errores.push('La tasa de IVA debe ser 0%, 8% o 16%.');
    if (errores.length) return { errores };
    const monto = pct ? total / (1 + pct) : total;
    return { monto, pct, ivaMonto: total - monto, total, errores: [] };
  }

  if (modo === 'C') {
    const total = num(totalConIva), ivaMonto = num(ivaPesos);
    const errores = [];
    if (total === null || total < 0) errores.push('El TOTAL debe ser un número (ej. 500.00) y no negativo.');
    if (ivaMonto === null || ivaMonto < 0) errores.push('El IVA (en pesos, el que dice tu ticket/CFDI) debe ser un número y no negativo.');
    if (!errores.length && ivaMonto >= total) errores.push('El IVA no puede ser mayor o igual al TOTAL.');
    if (errores.length) return { errores };
    const monto = total - ivaMonto;
    const pct = monto > 0 ? ivaMonto / monto : 0;
    return { monto, pct, ivaMonto, total, errores: [] };
  }

  // Modo A (default): base + tasa, el sistema suma el IVA.
  const monto = num(montoSinIva), pct = num(ivaPct);
  const errores = [];
  if (monto === null || monto < 0) errores.push('El MONTO debe ser un número (ej. 150.00) y no negativo.');
  if (pct === null || pct < 0) errores.push('El IVA debe ser un número (0, 0.08 o 0.16).');
  if (errores.length) return { errores };
  return { monto, pct, ivaMonto: monto * pct, total: monto + monto * pct, errores: [] };
}

// ── Listas de tipos de gasto / formas de pago (publicadas por el ERP,
// services/publicar.py::csv_listas_gasto) -- se cachean igual que el
// catálogo/stock teórico: sin señal se usa la última copia guardada. ────────
let TIPOS_GASTO = [];
let FORMAS_PAGO = [];

function _guardarListasGastoCache_(filas) {
  guardarSeguro('listas_gasto_cache', { ts: Date.now(), filas });
}
function _repartirListasGasto_(filas) {
  TIPOS_GASTO = (filas || []).filter(f => String(f.CLASE || '').toUpperCase() === 'TIPO').map(f => f.NOMBRE);
  FORMAS_PAGO = (filas || []).filter(f => String(f.CLASE || '').toUpperCase() === 'FORMA').map(f => f.NOMBRE);
  _pintarOpcionesGasto_();
}

// _cargarListasGasto_() es fire-and-forget (no bloquea el render del
// formulario) -- si la respuesta llega DESPUÉS de que renderGastos() ya pintó
// los <select> con TIPOS_GASTO/FORMAS_PAGO todavía vacíos, hay que repintarlos
// aquí o el usuario se queda viendo solo "— elige —" sin poder capturar el
// gasto. No-op si el usuario ya se salió de Gastos (los <select> no existen).
function _pintarOpcionesGasto_() {
  const selTipo = document.getElementById('gas_tipo');
  if (selTipo) {
    const actual = selTipo.value;
    selTipo.innerHTML = '<option value="">— elige —</option>' + TIPOS_GASTO.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
    selTipo.value = actual;
  }
  const selForma = document.getElementById('gas_forma');
  if (selForma) {
    const actual = selForma.value;
    selForma.innerHTML = '<option value="">— elige —</option>' + FORMAS_PAGO.map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join('');
    selForma.value = actual;
  }
}
// Mejora (2026-09-02): mismo aviso de frescura que ya existe para el catálogo
// en Inventario (avisoCache/CATALOGO_FRESCO) -- Gastos no tenía ninguno, y
// las listas de tipo/forma también pueden quedarse viejas sin señal.
function _htmlAntiguedadListasGasto_() {
  const cache = leerSeguro('listas_gasto_cache', null);
  if (!cache || !cache.ts) return '';
  return `<div class="card" style="margin-bottom:0;font-size:12px;color:var(--sm-muted)">Listas actualizadas hace ${_haceCuanto_(cache.ts)}</div>`;
}
async function _cargarListasGasto_() {
  if (!navigator.onLine || !API_TOKEN) {
    const cache = leerSeguro('listas_gasto_cache', null);
    if (cache && cache.filas) _repartirListasGasto_(cache.filas);
    return;
  }
  try {
    const url = getScriptUrl();
    const res = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ tipo: 'listas_gasto', token: API_TOKEN }),
    });
    const filas = await res.json();
    if (!Array.isArray(filas)) throw new Error('respuesta inválida');
    _repartirListasGasto_(filas);
    _guardarListasGastoCache_(filas);
  } catch (_) {
    const cache = leerSeguro('listas_gasto_cache', null);
    if (cache && cache.filas) _repartirListasGasto_(cache.filas);
  }
}

// Ecosistema centralizado (2026-09): solo la sección GASTOS (política OCR,
// umbral de frescura del stock, tope de foto) -- se llama UNA vez al abrir
// la app, no en cada renderGastos() como listas_gasto (esto cambia poco).
function _aplicarConfigGastosPublicada_(gastos) {
  if (!gastos) return;
  if (typeof gastos.foto_tope_kb === 'number' && gastos.foto_tope_kb > 0) {
    FOTO_TOPE_KB_PUBLICADO = gastos.foto_tope_kb;
  }
}
async function _cargarConfiguracionEcosistema_() {
  if (!navigator.onLine || !API_TOKEN) {
    const cache = leerSeguro('config_ecosistema_cache', null);
    if (cache && cache.datos) _aplicarConfigGastosPublicada_(cache.datos.GASTOS);
    return;
  }
  try {
    const url = getScriptUrl();
    const res = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ tipo: 'configuracion', token: API_TOKEN }),
    });
    const r = await res.json();
    if (!r || !r.ok || !r.datos) throw new Error('respuesta inválida');
    guardarSeguro('config_ecosistema_cache', { ts: r.ts || '', datos: r.datos });
    _aplicarConfigGastosPublicada_(r.datos.GASTOS);
  } catch (_) {
    const cache = leerSeguro('config_ecosistema_cache', null);
    if (cache && cache.datos) _aplicarConfigGastosPublicada_(cache.datos.GASTOS);
  }
}

// ── Foto del ticket: opcional, se manda como base64 (mismo criterio que el
// PDF de una remisión) -- si el archivo es grande el POST tarda más, pero
// nunca bloquea el guardado local (se encola igual, con o sin foto lista). ──
function _leerArchivoComoB64_(file) {
  return new Promise((resolve) => {
    if (!file) { resolve(''); return; }
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
    reader.onerror = () => resolve('');
    reader.readAsDataURL(file);
  });
}

// ── Compresión de la foto del ticket (2026-08-27, plan OCR Fase 1) ───────────
// Una foto de celular sin comprimir pesa 4-8 MB; en base64 crece ~37% más, y
// se guarda TAL CUAL dentro de cola_gastos (localStorage). El origen de esta
// app es el MISMO que remision.html (mismo repo GitHub Pages) -- localStorage
// es por origen, no por pestaña -- así que 1-2 fotos sin comprimir pueden
// llenar la cuota compartida (~5MB) y tumbar también datos del Cotizador
// (cobros, folios, borradores). Comprimir a ~200KB es una reducción de ~40x.
// Un ticket es texto sobre papel: a 1600px de lado se lee perfecto, para el
// ojo y para el OCR.
function _escalarLado_(ancho, alto, maxLado) {
  const mayor = Math.max(ancho, alto);
  if (mayor <= maxLado) return { w: ancho, h: alto }; // nunca agrandar
  const factor = maxLado / mayor;
  return { w: Math.round(ancho * factor), h: Math.round(alto * factor) };
}

function _comprimirImagen_(file, maxLado, calidad) {
  maxLado = maxLado || 1600;
  calidad = calidad || 0.72;
  return new Promise((resolve) => {
    if (!file) { resolve(''); return; }
    // Cualquier fallo en el camino de compresión regresa al comportamiento de
    // hoy (foto sin comprimir) -- el gasto NUNCA se pierde por la foto, mismo
    // criterio que ya rige _leerArchivoComoB64_ arriba.
    const fallback = () => _leerArchivoComoB64_(file).then(resolve);
    try {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const { w, h } = _escalarLado_(img.naturalWidth || img.width, img.naturalHeight || img.height, maxLado);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          _exportarConCalidadDecreciente_(canvas, calidad).then(resolve).catch(fallback);
        } catch (e) { URL.revokeObjectURL(url); fallback(); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); fallback(); };
      img.src = url;
    } catch (e) { fallback(); }
  });
}

// Reintenta con calidad más baja si el JPEG sigue pesando arriba de 250KB.
// Si ni al piso de calidad baja lo suficiente, usa lo que haya -- nunca
// bloquea el guardado por perseguir un tamaño perfecto.
function _exportarConCalidadDecreciente_(canvas, calidadInicial) {
  const TOPE_BYTES = FOTO_TOPE_KB_PUBLICADO * 1024;
  const PISO_CALIDAD = 0.45;
  return new Promise((resolve, reject) => {
    const intentar = (q) => {
      canvas.toBlob((blob) => {
        if (!blob) { reject(new Error('toBlob vacío')); return; }
        if (blob.size > TOPE_BYTES && q > PISO_CALIDAD) {
          intentar(Math.max(PISO_CALIDAD, +(q - 0.1).toFixed(2)));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || '').split(',')[1] || '');
        reader.onerror = () => reject(new Error('FileReader falló'));
        reader.readAsDataURL(blob);
      }, 'image/jpeg', q);
    };
    intentar(calidadInicial);
  });
}

function _cambiarModoGasto_(modo) {
  ['A', 'B', 'C'].forEach(m => {
    const el = document.getElementById('gasCampos' + m);
    if (el) el.style.display = (m === modo) ? '' : 'none';
  });
  _actualizarPreviewGasto_();
}

function _actualizarPreviewGasto_() {
  const modo = (document.querySelector('input[name="gasModo"]:checked') || {}).value || 'A';
  const r = _calcularMontosGasto_(modo,
    document.getElementById('gas_montoA')?.value,
    modo === 'A' ? document.getElementById('gas_ivaA')?.value : document.getElementById('gas_ivaB')?.value,
    // Bug real corregido (2026-08-27, plan OCR Fase 3): modo B y modo C tenían
    // el MISMO id "gas_totalBC" en dos <input> distintos -- getElementById
    // siempre devuelve el primero en el DOM (el de B), así que en modo C lo
    // que el usuario escribía en el campo visible nunca se leía. Modo C ahora
    // tiene su propio id "gas_totalC".
    (modo === 'C' ? document.getElementById('gas_totalC') : document.getElementById('gas_totalBC'))?.value,
    document.getElementById('gas_ivaC')?.value);
  const prev = document.getElementById('gasPreview');
  if (!prev) return;
  if (r.errores && r.errores.length) {
    prev.innerHTML = '<span style="color:var(--sm-chart-4)">' + esc(r.errores[0]) + '</span>';
  } else {
    prev.innerHTML = `Base: $${r.monto.toFixed(2)} · IVA: $${r.ivaMonto.toFixed(2)} · <strong>Total: $${r.total.toFixed(2)}</strong>`;
  }
}

// ── Estatus de Evidencia (plan OCR Fase 2, 2026-08-27) ────────────────────────
// Se calcula en el celular y SIEMPRE viaja en el payload (nunca en blanco) --
// así la columna "Estatus de Evidencia" se autocrea en la hoja desde el
// PRIMER gasto capturado tras el despliegue (ver services/puente.py::CAMPOS,
// que sí la exige en el contrato). CFDI pesa más que la foto -- si ya hay
// factura, la foto del ticket es evidencia extra, no la principal.
function _estatusEvidenciaGasto_(tieneFoto, uuidCfdi, tocadoPorOcr) {
  if (uuidCfdi) return 'CFDI';
  if (tieneFoto && tocadoPorOcr) return 'FOTO+OCR';
  if (tieneFoto) return 'FOTO';
  return 'MANUAL';
}

// ── OCR de tickets (plan OCR Fase 3, 2026-08-27) ──────────────────────────────
// Botón explícito, NUNCA automático (§3.3 del plan) -- la llamada al Apps
// Script (tipo:'ocr_ticket') solo ocurre cuando el usuario presiona "Leer
// ticket", una sola vez, ANTES de encolar. Si viviera dentro del guardado,
// cada reintento offline volvería a pagar la lectura de la imagen.
let _gastoTocadoPorOcr = false;
let _gastoFotoComprimidaB64 = ''; // cache: evita comprimir 2 veces (preview + OCR)

// "DD/MM/YYYY" -> "YYYY-MM-DD" (formato de <input type=date>). null si no es
// una fecha válida o no viene en ese formato.
function _parsearFechaOcr_(str) {
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(str || '').trim());
  if (!m) return null;
  const dd = +m[1], mm = +m[2], yyyy = +m[3];
  if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
  const p = n => String(n).padStart(2, '0');
  return `${yyyy}-${p(mm)}-${p(dd)}`;
}

// Traduce la respuesta del OCR a QUÉ hacer con el formulario -- función pura
// (sin tocar el DOM) para poder probarla. Nunca lanza; ante cualquier duda,
// { aplicado:false } y el formulario se queda como estaba (captura manual).
function _aplicarOcrAGasto_(resp) {
  const NADA = { aplicado: false };
  if (!resp || resp.ok !== true || !resp.campos) return NADA;
  if (resp.confianza == null || resp.confianza < 50) return NADA;
  const c = resp.campos;
  const total = Number(c.total);
  if (!(total > 0)) return NADA; // total ausente o 0 -> no hay nada que aplicar
  const out = { aplicado: true, proveedor: String(c.proveedor || '').trim(), fecha: null, total };
  const fechaOk = _parsearFechaOcr_(c.fecha);
  // Solo se usa si es válida y no es futura (comparado contra la fecha de hoy
  // del propio celular) -- una fecha del año que viene se ignora, se queda
  // la de hoy que ya trae el formulario.
  if (fechaOk && fechaOk <= _fechaLocal_()) out.fecha = fechaOk;
  const iva = Number(c.iva);
  if (iva > 0) {
    // Total + IVA exacto del papel -> modo C, sin recalcular nada (regla del
    // espejo: nunca se vuelve a multiplicar un IVA que ya viene en el ticket).
    out.modo = 'C';
    out.ivaMonto = iva;
  } else {
    // Solo vino el total -> modo B con la tasa default de la app (16%).
    out.modo = 'B';
    out.ivaPct = '0.16';
  }
  return out;
}

function _onFotoGastoElegida_() {
  _gastoTocadoPorOcr = false;
  _gastoFotoComprimidaB64 = '';
  const fotoInput = document.getElementById('gas_foto');
  const file = fotoInput && fotoInput.files ? fotoInput.files[0] : null;
  const preview = document.getElementById('gasFotoPreview');
  const btnOcr = document.getElementById('gasBtnOcr');
  const estado = document.getElementById('gasOcrEstado');
  if (estado) estado.textContent = '';
  if (!file) {
    if (preview) { preview.style.display = 'none'; preview.src = ''; }
    if (btnOcr) btnOcr.style.display = 'none';
    return;
  }
  if (preview) {
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
  }
  if (btnOcr) {
    btnOcr.style.display = 'block';
    const online = navigator.onLine;
    btnOcr.disabled = !online;
    btnOcr.textContent = online ? '🔍 Leer ticket' : '🔍 Leer ticket (sin señal)';
  }
}

// Marca un campo como "tocado por la IA" (fondo suave) -- la marca desaparece
// sola en cuanto el usuario edita ESE campo (Paso 3.4 del plan: "Todos los
// campos quedan editables... la leyenda desaparece si el usuario lo edita").
function _marcarTocadoPorIA_(el) {
  if (!el) return;
  el.classList.add('ia-tocado');
  const quitar = () => el.classList.remove('ia-tocado');
  el.addEventListener('input', quitar, { once: true });
  el.addEventListener('change', quitar, { once: true });
}

async function _leerTicketConIA_() {
  const btnOcr = document.getElementById('gasBtnOcr');
  const estado = document.getElementById('gasOcrEstado');
  const fotoInput = document.getElementById('gas_foto');
  const file = fotoInput && fotoInput.files ? fotoInput.files[0] : null;
  if (!file || !navigator.onLine) return;
  const url = getScriptUrl();
  if (!url || !API_TOKEN) return;
  if (btnOcr) { btnOcr.disabled = true; btnOcr.textContent = 'Leyendo…'; }
  if (estado) estado.textContent = '';
  try {
    // Comprime UNA vez y la reusa para el guardado -- así el ticket no se
    // comprime dos veces ni se lee dos veces por accidente.
    if (!_gastoFotoComprimidaB64) _gastoFotoComprimidaB64 = await _comprimirImagen_(file);
    const res = await fetch(url, {
      method: 'POST', headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ tipo: 'ocr_ticket', token: API_TOKEN, foto: _gastoFotoComprimidaB64 }),
    });
    const resp = await res.json();
    const r = _aplicarOcrAGasto_(resp);
    if (!r.aplicado) {
      _gastoTocadoPorOcr = false;
      toast('No se pudo leer bien el ticket — captúralo a mano.', 4000);
      if (estado) estado.textContent = '⚠️ No se pudo leer, captura a mano.';
      return;
    }
    _gastoTocadoPorOcr = true;
    // Modo + montos (nunca se recalculan, van tal cual los devolvió el OCR).
    const radioModo = document.querySelector(`input[name="gasModo"][value="${r.modo}"]`);
    if (radioModo) { radioModo.checked = true; _cambiarModoGasto_(r.modo); }
    if (r.modo === 'C') {
      const elTotal = document.getElementById('gas_totalC');
      const elIva = document.getElementById('gas_ivaC');
      if (elTotal) { elTotal.value = r.total.toFixed(2); _marcarTocadoPorIA_(elTotal); }
      if (elIva) { elIva.value = r.ivaMonto.toFixed(2); _marcarTocadoPorIA_(elIva); }
    } else {
      const elTotal = document.getElementById('gas_totalBC');
      const elIvaSel = document.getElementById('gas_ivaB');
      if (elTotal) { elTotal.value = r.total.toFixed(2); _marcarTocadoPorIA_(elTotal); }
      if (elIvaSel) { elIvaSel.value = r.ivaPct; _marcarTocadoPorIA_(elIvaSel); }
    }
    if (r.proveedor) {
      const elProv = document.getElementById('gas_proveedor');
      if (elProv) { elProv.value = r.proveedor; _marcarTocadoPorIA_(elProv); }
    }
    if (r.fecha) {
      const elFecha = document.getElementById('gas_fecha');
      if (elFecha) { elFecha.value = r.fecha; _marcarTocadoPorIA_(elFecha); }
    }
    _actualizarPreviewGasto_();
    if (estado) estado.textContent = '✅ IA — revísalo antes de guardar.';
    toast('✅ Ticket leído. Revisa los datos antes de guardar.', 4000);
  } catch (e) {
    _gastoTocadoPorOcr = false;
    toast('No se pudo leer el ticket (sin señal o error). Captúralo a mano.', 4000);
    if (estado) estado.textContent = '⚠️ Error de lectura, captura a mano.';
  } finally {
    if (btnOcr) { btnOcr.disabled = !navigator.onLine; btnOcr.textContent = navigator.onLine ? '🔍 Leer ticket' : '🔍 Leer ticket (sin señal)'; }
  }
}

// Un solo gasto a la vez. Entre el toque del botón y el encolado hay un
// `await` (la compresión de la foto), y sin este candado dos toques durante
// esa espera corrían la función completa dos veces: cada pasada generaba su
// propio crypto.randomUUID(), así que la protección anti-duplicado del
// servidor (que compara IDs) los veía como gastos distintos y registraba dos
// veces el mismo ticket, con sus dos salidas de caja.
let _guardandoGasto = false;
async function _guardarGasto_() {
  if (_guardandoGasto) return;
  _guardandoGasto = true;
  try {
  const fecha = document.getElementById('gas_fecha').value || _fechaLocal_();
  const concepto = (document.getElementById('gas_concepto').value || '').trim();
  const tipoGasto = document.getElementById('gas_tipo').value || '';
  const forma = document.getElementById('gas_forma').value || '';
  const modo = (document.querySelector('input[name="gasModo"]:checked') || {}).value || 'A';
  if (!concepto) { toast('Escribe el concepto del gasto.'); return; }
  if (!tipoGasto) { toast('Elige el tipo de gasto.'); return; }
  if (!forma) { toast('Elige la forma de pago.'); return; }

  const r = _calcularMontosGasto_(modo,
    document.getElementById('gas_montoA')?.value,
    modo === 'A' ? document.getElementById('gas_ivaA')?.value : document.getElementById('gas_ivaB')?.value,
    (modo === 'C' ? document.getElementById('gas_totalC') : document.getElementById('gas_totalBC'))?.value,
    document.getElementById('gas_ivaC')?.value);
  if (r.errores && r.errores.length) { toast(r.errores[0]); return; }
  // Mejora (2026-09-02): un total grande suele ser un cero de más al teclear
  // -- una sola confirmación explícita, no bloquea gastos grandes reales.
  if (r.total >= UMBRAL_GASTO_ATIPICO &&
      !confirm('El total es $' + r.total.toFixed(2) + ', ¿es correcto?')) return;

  const fotoInput = document.getElementById('gas_foto');
  const fotoFile = fotoInput && fotoInput.files ? fotoInput.files[0] : null;
  // Reusa la compresión que ya hizo _leerTicketConIA_ si el usuario pasó por
  // ahí -- nunca comprime la misma foto dos veces.
  const fotoB64 = _gastoFotoComprimidaB64 || await _comprimirImagen_(fotoFile);
  const uuidCfdi = (document.getElementById('gas_uuid_cfdi').value || '').trim();
  const proveedor = (document.getElementById('gas_proveedor')?.value || '').trim();
  const estatusEvidencia = _estatusEvidenciaGasto_(!!fotoB64, uuidCfdi, _gastoTocadoPorOcr);

  const id = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID()
             : 'gto_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9);
  const payload = {
    tipo: 'gasto', id, fecha, concepto, tipoGasto, modo,
    montoSinIva: r.monto.toFixed(2), ivaPct: r.pct, ivaMonto: r.ivaMonto.toFixed(2),
    total: r.total.toFixed(2), formaPago: forma, foto: fotoB64, uuidCfdi,
    proveedor, estatusEvidencia,
    device: _leerVendedorCompartido(),
  };
  const guardadoEnCola = _encolarGasto_(payload);

  const recientes = leerSeguro('gastos_recientes', []);
  recientes.unshift({ concepto, tipoGasto, fecha, total: r.total, formaPago: forma });
  guardarSeguro('gastos_recientes', recientes.slice(0, 20));

  // Bug real corregido (2026-09-02): cuando la cola no cabía en localStorage,
  // _encolarGasto_ YA avisaba "puede perderse" (8s) -- pero esta línea de
  // aquí, inmediatamente después, le pintaba encima el toast de éxito y lo
  // tapaba, así que el aviso real nunca se alcanzaba a leer. Mismo criterio
  // que usaba el conteo de Inventario (_colaFallo, F5): si no se guardó, NO
  // se dice que se guardó.
  // 2026-09-09: además de no decir "guardado", cuando la cola NO aceptó el
  // gasto hay que CONSERVAR la captura. Antes se seguía derecho a limpiar la
  // foto comprimida y a repintar la pantalla, así que el usuario leía "puede
  // perderse" y al voltear ya no tenía nada que reintentar: el expediente
  // (foto incluida) se había borrado. `gastos_recientes` no lo sustituye,
  // solo guarda concepto/tipo/fecha/total/forma.
  if (!guardadoEnCola) return;

  toast('✅ Gasto guardado y en cola de envío.');
  _gastoTocadoPorOcr = false;
  _gastoFotoComprimidaB64 = '';
  renderGastos();
  } finally {
    _guardandoGasto = false;
  }
}

function _encolarGasto_(payload) {
  const cola = leerSeguro('cola_gastos', []);
  if (!_dedupeCola_(cola, payload.id)) cola.push({ ...payload, ts: Date.now(), _try: 0 });
  // Aviso proactivo (2026-08-27, plan OCR Fase 1): con la foto ya comprimida
  // (~200KB) esto solo debería dispararse si se acumularon MUCHOS gastos sin
  // señal -- avisa antes de chocar con la cuota, no bloquea nada.
  if (JSON.stringify(cola).length > 3000000) {
    toast('⚠️ La cola de envío está muy pesada. Conéctate a internet para vaciarla antes de capturar más gastos con foto.', 6000);
  }
  const guardado = guardarSeguro('cola_gastos', cola);
  actualizarBadgePendientes();
  if (!guardado) {
    toast('⚠️ No se pudo guardar en la cola (memoria del teléfono llena). Este gasto puede perderse -- libera espacio o repórtalo.', 8000);
    return false;
  }
  procesarColaGastos();
  return true;
}

let _procGastoEnCurso = false;
async function procesarColaGastos() {
  if (_procGastoEnCurso || !navigator.onLine) return;
  const url = getScriptUrl();
  if (!url || !API_TOKEN) return;
  const cola = leerSeguro('cola_gastos', []);
  if (!cola.length) return;
  _procGastoEnCurso = true;
  try {
    for (const item of [...cola]) {
      try {
        const res = await fetch(url, {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(item),
        });
        const d = await res.json();
        if (d && d.ok && item.foto && d.fotoOk === false) {
          // El servidor acepta el gasto aunque Drive rechace la foto: responde
          // ok:true con fotoOk:false. Antes solo se miraba `d.ok`, así que el
          // item se borraba de la cola y la evidencia se perdía sin forma de
          // reenviarla desde la app. Se conserva para reintentar: el servidor
          // completa la foto sobre la fila que ya existe (rama YA_EXISTIA).
          _bumpIntentoGasto_(item.id);
        } else if (d && d.ok) {
          const actual = leerSeguro('cola_gastos', []).filter(e => e.id !== item.id);
          guardarSeguro('cola_gastos', actual);
        } else {
          _bumpIntentoGasto_(item.id);
        }
      } catch (_) {
        _bumpIntentoGasto_(item.id);
      }
    }
  } finally {
    _procGastoEnCurso = false;
    actualizarBadgePendientes();
  }
}
function _bumpIntentoGasto_(id) {
  const cola = leerSeguro('cola_gastos', []);
  cola.forEach(e => { if (e.id === id) e._try = (e._try || 0) + 1; });
  guardarSeguro('cola_gastos', cola);
}

// Sin esto, un token mal tecleado (o revocado) dejaba la app atorada en esta
// tarjeta de error para siempre: no había forma de volver a escribir el token
// salvo borrando datos del navegador a mano (impráctico en bodega, en el celular).
function _reabrirTokenGate_() {
  API_TOKEN = '';
  localStorage.removeItem('api_token');
  document.getElementById('app').innerHTML = '';
  const inp = document.getElementById('tg_input');
  if (inp) inp.value = '';
  _tokenGateCheck();
}

if (API_TOKEN) { _iniciarAppSegunModo_(); _cargarConfiguracionEcosistema_(); }

// Compartido por exportarConteoCSV() y exportarGastosCSV() -- antes cada uno
// armaba su propio Blob/link a mano, duplicado.
function _descargarCSV_(filas, nombreArchivo) {
  const csv = filas.map(f => f.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Mejora (2026-09-02): gastos_recientes ya guardaba los últimos 20 -- exportar
// a .csv para pasárselo al contador sin escribirlos a mano. Solo lo que hay
// EN ESTE celular (no jala del servidor, mismo alcance que "recientes").
function exportarGastosCSV() {
  const recientes = leerSeguro('gastos_recientes', []);
  if (!recientes.length) { toast('Sin gastos capturados todavía en este celular.'); return; }
  const filas = [['Fecha', 'Concepto', 'Tipo', 'Forma de pago', 'Total']];
  recientes.forEach(g => filas.push([g.fecha, g.concepto, g.tipoGasto || '', g.formaPago || '', (+g.total || 0).toFixed(2)]));
  _descargarCSV_(filas, `gastos_${_fechaLocal_()}.csv`);
}

// ── Candado de cierre/edición (F4: compartido con remisiones vía localStorage) ──
const CODIGO_BORRADO = '2526'; // respaldo local; localStorage tiene prioridad
function _codigoActivo_() {
  const v = (localStorage.getItem('codigo_borrado_override') || '').trim();
  return v || CODIGO_BORRADO;
}

// Fecha LOCAL (no UTC): toISOString() usa UTC y corría la fecha del conteo un
// día antes de ~17:00 hora local al llegar al servidor. yyyy-mm-dd en hora
// local evita cualquier conversión de zona horaria en el camino.
function _fechaLocal_() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

// ── Armar payload de envío (F1: blanco no viaja, 0 explícito sí) ─────────────
// Propuesta 4 (2026-09-10): cada renglón lleva el teórico que se vio en
// pantalla (teorico_ref, null si el celular no tenía ese producto) y la sesión
// lleva cuándo publicó el ERP ese teórico (referencia_ts). El ERP lo usa solo
// para mostrar si la referencia cambió entre el conteo y su revisión -- el
// ajuste se sigue calculando allá, nunca con este número.
function _armarPayloadConteo_(conteo, fechaISO, stockMap, referenciaTs) {
  const items = conteo.items
    .filter(it => it.cantidad !== null)
    .map(it => {
      const e = stockMap ? stockMap.get(String(it.codigo || '').toLowerCase()) : null;
      return { codigo: it.codigo, descripcion: it.descripcion, cantidad: it.cantidad,
               teorico_ref: e ? e.stock : null };
    });
  return {
    id: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID()
        : 'cnt_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 9),
    fecha: fechaISO,
    categoria: conteo.categoria,
    contador: conteo.contador || '',
    referencia_ts: referenciaTs || '',
    items: items,
  };
}

_tokenGateCheck();

let _procConteoEnCurso = false;

// ── Conteo a medias al llegar esta versión (F5, 2026-09-11) ────────────────
// Inventario se mudó a la app de Dirección. Los conteos YA cerrados siguen en
// 'cola_conteo' y se envían solos como siempre (procesarColaConteo, abajo).
// Pero un conteo SIN cerrar en 'conteo_actual' no se puede pasar a Dirección
// (cada app guarda sus datos por separado) y ya no hay pantalla para
// terminarlo aquí -- en vez de perderlo en silencio, se ofrece enviarlo como
// está (solo lo contado) o exportarlo. Nunca se borra antes de estar a salvo
// en la cola.
function _conteoHuerfano_() {
  const c = leerSeguro('conteo_actual', null);
  if (!c || c.cerrado || !Array.isArray(c.items)) return null;
  const contados = c.items.filter(it => it.cantidad !== null).length;
  return contados ? { conteo: c, contados } : null;
}

function _htmlConteoHuerfano_() {
  const h = _conteoHuerfano_();
  if (!h) return '';
  return `<div class="card" style="border-left:4px solid var(--sm-aviso)">
    <strong style="font-size:13px">📋 Tienes un conteo sin cerrar: ${esc(h.conteo.categoria)} (${h.contados}/${h.conteo.items.length} contados)</strong>
    <p style="font-size:12px;color:var(--sm-muted);margin:4px 0 8px">Inventario ahora vive en la app de Dirección. Para no perder lo que ya contaste, envíalo como está (solo lo que contaste; lo que no tocaste queda fuera) o expórtalo.</p>
    <button class="btn" style="width:100%" onclick="_enviarConteoHuerfano_()">Cerrar y enviar lo contado</button>
    <button class="btn secondary" style="width:100%;margin-top:8px" onclick="_exportarConteoHuerfano_()">⬇️ Exportar (.csv)</button>
  </div>`;
}

function _enviarConteoHuerfano_() {
  const h = _conteoHuerfano_();
  if (!h) return;
  if (!confirm('¿Cerrar y enviar este conteo con los ' + h.contados + ' producto(s) que contaste? Lo que no tocaste NO se envía.')) return;
  const codigo = prompt('Código de seguridad:');
  if (codigo === null) return;
  if (codigo.trim() !== _codigoActivo_()) { toast('Código incorrecto'); return; }
  const c = h.conteo;
  if (!c.contador) c.contador = _leerVendedorCompartido() || '';
  const cacheST = leerSeguro('stock_teorico_cache', null);
  const payload = _armarPayloadConteo_(c, _fechaLocal_(),
    _construirStockTeoricoMap(cacheST && cacheST.filas), cacheST && cacheST.ts);
  const cola = leerSeguro('cola_conteo', []);
  if (!_dedupeCola_(cola, payload.id)) cola.push({ ...payload, ts: Date.now(), _try: 0 });
  if (!guardarSeguro('cola_conteo', cola)) {
    toast('⚠️ No se pudo guardar en la cola (memoria del teléfono llena). El conteo sigue guardado aquí -- libera espacio y vuelve a intentar.', 8000);
    return;
  }
  localStorage.removeItem('conteo_actual'); // ya está a salvo en la cola
  actualizarBadgePendientes();
  procesarColaConteo();
  toast('Conteo en cola de envío.');
  renderGastos();
}

function _exportarConteoHuerfano_() {
  const h = _conteoHuerfano_();
  if (!h) return;
  const filas = [['Codigo', 'Descripcion', 'Cantidad']];
  h.conteo.items.forEach(it => { if (it.cantidad !== null) filas.push([it.codigo, it.descripcion, it.cantidad]); });
  const nombreCat = String(h.conteo.categoria || 'conteo').replace(/[^a-z0-9]+/gi, '_');
  _descargarCSV_(filas, `conteo_${nombreCat}_${_fechaLocal_()}.csv`);
}

const MAX_INTENTOS_AVISO = 10; // ~5 min a 30s/intento: a partir de aquí se marca "atascado" en la UI de cola

async function procesarColaConteo() {
  if (_procConteoEnCurso || !navigator.onLine) return;
  const url = getScriptUrl();
  if (!url || !API_TOKEN) return;
  const cola = leerSeguro('cola_conteo', []);
  if (!cola.length) return;
  _procConteoEnCurso = true;
  try {
    for (const item of [...cola]) {
      try {
        const res = await fetch(url, {
          method: 'POST', headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ tipo: 'conteo_inventario', token: API_TOKEN, ...item }),
        });
        const d = await res.json();
        if (d && d.ok) {
          const actual = leerSeguro('cola_conteo', []);
          // Carrera real (2026-09-09): si el usuario corrigió una cantidad
          // MIENTRAS esta petición viajaba, _reencolarCorreccion_ reescribió
          // la cola pero lo que llegó al servidor fue la versión vieja. Antes
          // se borraba por ID sin comparar, así que la corrección desaparecía
          // en silencio y el ERP ajustaba con el dato equivocado.
          // No se reenvía con el mismo ID a propósito: el ERP es idempotente
          // por origen_conteo (services/importar.py::importar_conteo) y lo
          // ignoraría, dejando creer que se corrigió. Se avisa, con el mismo
          // criterio que _reencolarCorreccion_ ya usa para "ya se había
          // enviado".
          const enCola = actual.find(e => e.id === item.id);
          if (enCola && JSON.stringify(enCola.items) !== JSON.stringify(item.items)) {
            toast('⚠️ Corregiste una cantidad mientras el conteo se enviaba: viajó la cantidad anterior. Avisa para un ajuste manual en el ERP o cuenta ese producto en un conteo nuevo.', 9000);
          }
          guardarSeguro('cola_conteo', actual.filter(e => e.id !== item.id));
        } else {
          _bumpIntentoConteo(item.id);
        }
      } catch (_) {
        _bumpIntentoConteo(item.id);
      }
    }
  } finally {
    _procConteoEnCurso = false;
    actualizarBadgePendientes();
  }
}

function _bumpIntentoConteo(id) {
  const cola = leerSeguro('cola_conteo', []);
  cola.forEach(e => { if (e.id === id) e._try = (e._try || 0) + 1; });
  guardarSeguro('cola_conteo', cola);
}

// J-1: la campana ahora suma AMBAS colas (conteo + gastos) -- un pendiente es
// un pendiente, sin importar de qué pestaña salió.
function actualizarBadgePendientes() {
  const n = leerSeguro('cola_conteo', []).length + leerSeguro('cola_gastos', []).length;
  const el = document.getElementById('badgePendientes');
  el.textContent = n ? n + ' pendiente' + (n > 1 ? 's' : '') + ' 👆' : '';
}

// UI de la cola pendiente (F6 + mejora #8, unificada J-1): ve qué falta por
// mandar de AMBAS colas, con tope visible de intentos, reenviar uno a la vez
// o descartarlo con aviso.
function verColaPendiente() {
  const colaC = leerSeguro('cola_conteo', []).map(e => ({ ...e, _cola: 'conteo' }));
  const colaG = leerSeguro('cola_gastos', []).map(e => ({ ...e, _cola: 'gasto' }));
  const cola = colaC.concat(colaG).sort((a, b) => (a.ts || 0) - (b.ts || 0));
  if (!cola.length) { toast('No hay nada pendiente de enviar.'); return; }
  const filas = cola.map(e => {
    const atascado = (e._try || 0) >= MAX_INTENTOS_AVISO;
    const esGasto = e._cola === 'gasto';
    const desc = esGasto
      ? esc(e.concepto) + ' — $' + (Number(e.total) || 0).toFixed(2)
      : esc(e.categoria) + ' — ' + e.items.length + ' producto(s)';
    return `
    <div class="fila-producto">
      <div class="info">
        <div>${esGasto ? '💰' : '📋'} ${desc}</div>
        <div class="codigo">Fecha ${esc(e.fecha)} · intento ${e._try || 0}${atascado ? ' ⚠️ atascado' : ''}</div>
      </div>
      <button class="btn secondary" style="width:auto;padding:6px 10px" onclick="_reenviarUno_('${e.id}','${e._cola}')">↻</button>
      <button class="btn danger" style="width:auto;padding:6px 10px" onclick="_descartarUno_('${e.id}','${e._cola}')">🗑</button>
    </div>`;
  }).join('');
  const volver = 'renderGastos()';
  document.getElementById('app').innerHTML = `
    <div class="card">
      <strong>Pendientes de enviar (${cola.length})</strong>
      <p style="font-size:12px;color:var(--sm-muted);margin:4px 0 8px">Se reintentan solos cada 30s con señal. "Atascado" = lleva ${MAX_INTENTOS_AVISO}+ intentos fallidos — revisa el token o avisa.</p>
      ${filas}
      <button class="btn secondary" style="width:100%;margin-top:10px" onclick="_reabrirTokenGate_()">🔑 Cambiar token</button>
      <button class="btn secondary" style="width:100%;margin-top:8px" onclick="${volver}">← Volver</button>
    </div>`;
}
function _reenviarUno_(id, tipoCola) {
  const clave = tipoCola === 'gasto' ? 'cola_gastos' : 'cola_conteo';
  const cola = leerSeguro(clave, []);
  cola.forEach(e => { if (e.id === id) e._try = 0; });
  guardarSeguro(clave, cola);
  const proc = tipoCola === 'gasto' ? procesarColaGastos : procesarColaConteo;
  proc().then(verColaPendiente);
}
function _descartarUno_(id, tipoCola) {
  if (!confirm('¿Descartar este pendiente? Esos datos NO llegarán al ERP y esta acción no se puede deshacer.')) return;
  const clave = tipoCola === 'gasto' ? 'cola_gastos' : 'cola_conteo';
  const cola = leerSeguro(clave, []).filter(e => e.id !== id);
  guardarSeguro(clave, cola);
  actualizarBadgePendientes();
  verColaPendiente();
}

window.addEventListener('online', function () { procesarColaConteo(); procesarColaGastos(); });
setInterval(function () { procesarColaConteo(); procesarColaGastos(); }, 30000);
actualizarBadgePendientes();

// Liquid Glass: reflejo de luz que sigue al cursor -- mismo mecanismo que
// static/js/liquid-glass-theme.js del ERP (1.- SUMETEC-PY-SQL). Delegado
// desde document, un solo requestAnimationFrame, sin listener por tarjeta.
// En pantallas tactiles no hay pointermove de "hover" real, así que el
// efecto simplemente no se activa -- igual que en el ERP.
(function () {
  const SELECTOR = 'header, .card, .btn';
  let activo = null, pendiente = null, ticking = false;
  function aplicar() {
    ticking = false;
    if (!pendiente) return;
    const { el, x, y } = pendiente;
    if (activo && activo !== el) activo.classList.remove('sm-liquid-activa');
    el.style.setProperty('--sm-liquid-x', x + 'px');
    el.style.setProperty('--sm-liquid-y', y + 'px');
    el.classList.add('sm-liquid-activa');
    activo = el;
  }
  document.addEventListener('pointermove', function (ev) {
    if (ev.pointerType === 'touch') return;
    const el = ev.target.closest(SELECTOR);
    if (!el) {
      if (activo) { activo.classList.remove('sm-liquid-activa'); activo = null; }
      return;
    }
    const r = el.getBoundingClientRect();
    pendiente = { el, x: ev.clientX - r.left, y: ev.clientY - r.top };
    if (!ticking) { ticking = true; requestAnimationFrame(aplicar); }
  }, { passive: true });
  document.addEventListener('pointerleave', function () {
    if (activo) { activo.classList.remove('sm-liquid-activa'); activo = null; }
  }, { passive: true, capture: true });
})();
</script>

<script src="./version.js"></script>
<script>
// VERSION_DEPLOY y VERSION_CODIGO vienen de version.js (los escribe
// build_deploy.py en cada corrida): la hora real del build y el mismo hash
// que sw.js usa como nombre de caché ('sumetec-inv-<código>').
function _mostrarVersionInstalada() {
  const codigo = (typeof VERSION_CODIGO !== 'undefined' && VERSION_CODIGO) ? VERSION_CODIGO : null;
  const v = (typeof VERSION_DEPLOY !== 'undefined' && VERSION_DEPLOY)
    ? new Date(VERSION_DEPLOY).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' })
    : 'Sin información';
  const ultima = Number(localStorage.getItem('inv_ultima_actualizacion') || 0);
  const u = ultima
    ? new Date(ultima).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' })
    : 'Aún no se ha detectado una actualización nueva en este dispositivo.';
  alert(`Act. software: ${codigo ? codigo + ' · ' : ''}${v}\nÚltima actualización: ${u}`);
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then((reg) => {
    // El navegador solo revisa sw.js por su cuenta cada ~24h -- una PWA
    // abierta desde el ícono de inicio (retomada de segundo plano, sin
    // recarga completa) puede tardar horas o días en notar que hay una
    // versión nueva si no se le pregunta activamente. Mismo patrón que
    // Remisiones (2.- COTIZADOR/remision.html) y Mis Apps.
    const _revisar = () => reg.update().catch(() => {});
    setInterval(_revisar, 5 * 60 * 1000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') _revisar(); });
    window.addEventListener('online', _revisar);
    _revisar();

    let huboControlador = !!navigator.serviceWorker.controller;
    let recargaPendiente = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!huboControlador) { huboControlador = true; return; }
      localStorage.setItem('inv_ultima_actualizacion', String(Date.now()));
      if (hayTrabajoSinGuardarGastos()) { recargaPendiente = true; return; }
      window.location.reload();
    });
    // F5b (2026-09-11, punto 5 del checklist pwa-actualizacion-sin-cache):
    // antes solo revisaba el campo CON el foco en el momento exacto en que
    // llegaba la actualización -- un gasto ya llenado pero sin el cursor
    // encima se perdía igual, y si sí había algo, nunca se reintentaba
    // después. Mismo patrón que ya usan Dirección y Compras.
    document.addEventListener('visibilitychange', () => {
      if (!recargaPendiente || document.visibilityState !== 'hidden') return;
      if (hayTrabajoSinGuardarGastos()) return;
      window.location.reload();
    });
  }).catch(e => console.warn('SW:', e));
}

function hayTrabajoSinGuardarGastos() {
  const activo = document.activeElement;
  if (activo && (activo.tagName === 'INPUT' || activo.tagName === 'TEXTAREA') && activo.value) {
    return true;
  }
  const app = document.getElementById('app');
  if (!app) return false;
  return [...app.querySelectorAll('input, textarea')].some(el => (el.type !== 'file') && el.value);
}
</script>
